<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor de Mapas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Inicializar mapa
    const map = L.map('map').setView([-32.89, -68.84], 12);

    // 2. Capa base
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3. Cargar archivos GeoJSON externos usando fetch
    Promise.all([
      fetch('alturas.geojson').then(res => res.json()),
      fetch('colectores.geojson').then(res => res.json())
    ])
    .then(([dataAlturas, dataColectores]) => {

      // Capa Alturas (Puntos)
      const layerAlturas = L.geoJSON(dataAlturas, {
        pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 8, fillColor: "#e67e22", color: "#d35400" }),
        onEachFeature: (feature, layer) => {
          layer.bindPopup(`<b>${feature.properties.NOMBRE || 'Sin nombre'}</b><br>Cota: ${feature.properties.COTA || '-'} m`);
        }
      }).addTo(map);

      // Capa Colectores (Líneas)
      const layerColectores = L.geoJSON(dataColectores, {
        style: feature => ({ color: feature.properties.Clase === "Zanjon" ? "#c0392b" : "#2980b9", weight: 4 }),
        onEachFeature: (feature, layer) => {
          layer.bindPopup(`<b>${feature.properties.NOMBRE || 'Sin nombre'}</b><br>Longitud: ${feature.properties.LONGITUD || '-'}`);
        }
      }).addTo(map);

      // Ajustar la vista para encuadrar todos los datos
      const bounds = L.featureGroup([layerAlturas, layerColectores]).getBounds();
      if (bounds.isValid()) map.fitBounds(bounds);

      // Control de capas
      L.control.layers(null, { "Alturas": layerAlturas, "Colectores": layerColectores }).addTo(map);

    })
    .catch(err => console.error("Error cargando los archivos GeoJSON:", err));
  </script>
</body>
</html>
