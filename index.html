<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa GeoJSON - Mendoza</title>
  
  <!-- CSS de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- JS de Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 1. Inicializar el mapa
  const map = L.map('map').setView([-32.90, -68.85], 11);

  // 2. Capa base (OpenStreetMap)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // 3. Dataset GeoJSON: Alturas
  const geojsonAlturas = {
    "type": "FeatureCollection",
    "name": "Alturas",
    "crs": { "type": "name", "properties": { "name": "urn:ogc:def:crs:OGC:1.3:CRS84" } },
    "features": [
      { "type": "Feature", "properties": { "fid": 1, "TIPO": "CERRO", "NOMBRE": "DEL ARCO", "COTA": 1675.0, "FUENTE": "IGN" }, "geometry": { "type": "Point", "coordinates": [ -68.935234069824332, -32.835018157959226 ] } },
      { "type": "Feature", "properties": { "fid": 2, "TIPO": "CERRO", "NOMBRE": "DE LA GLORIA", "COTA": 984.0, "FUENTE": "IGN" }, "geometry": { "type": "Point", "coordinates": [ -68.890953063964943, -32.888015747070583 ] } }
    ]
  };

  // 4. Dataset GeoJSON: Colectores (Corregido a LineString continuo)
  const geojsonColectores = {
    "type": "FeatureCollection",
    "name": "Colectores",
    "crs": { "type": "name", "properties": { "name": "urn:ogc:def:crs:OGC:1.3:CRS84" } },
    "features": [
      { 
        "type": "Feature", 
        "properties": { "fid": 1, "NOMBRE": "CANAL SOSA", "TIPO": "Matriz", "LONGITUD": "3.58 km", "CAPACIDAD": "200 m3/s", "Clase": "Canal", "OBSERVACIO": "Forma parte de un sistema mixto..." }, 
        "geometry": { 
          "type": "LineString", 
          "coordinates": [ 
            [ -68.908645204435444, -32.900054891382689 ], 
            [ -68.907172226297988, -32.999066690860133 ], 
            [ -68.865347145113603, -32.994242862605503 ] 
          ] 
        } 
      },
      { 
        "type": "Feature", 
        "properties": { "fid": 2, "NOMBRE": "COLECTOR BALCARCE", "TIPO": "Descargador", "LONGITUD": "1.30 km", "Clase": "Colector", "OBSERVACIO": "Recoge los desagues pluviales..." }, 
        "geometry": { 
          "type": "LineString", 
          "coordinates": [ 
            [ -68.842268403576725, -32.922866495153052 ], 
            [ -68.838552324613275, -32.911852758368155 ] 
          ] 
        } 
      },
      { 
        "type": "Feature", 
        "properties": { "fid": 3, "NOMBRE": "COLECTOR BARRIO LOS CERRILLOS", "TIPO": "Canalización Intermedia", "LONGITUD": "0.91 km", "Clase": "Colector", "OBSERVACIO": "Suelo Natural" }, 
        "geometry": { 
          "type": "LineString", 
          "coordinates": [ 
            [ -68.887871599800107, -32.905398925500272 ], 
            [ -68.87981712431376, -32.909370961787907 ] 
          ] 
        } 
      },
      { 
        "type": "Feature", 
        "properties": { "fid": 4, "NOMBRE": "CANAL RIO SECO", "TIPO": "Descargador", "LONGITUD": "1.61 km", "Clase": "Canal", "OBSERVACIO": "Suelo natural" }, 
        "geometry": { 
          "type": "LineString", 
          "coordinates": [ 
            [ -68.880429231018439, -32.965473878279973 ], 
            [ -68.865712290219165, -32.960819693922105 ] 
          ] 
        } 
      },
      { 
        "type": "Feature", 
        "properties": { "fid": 5, "NOMBRE": "RIO SECO TEJO - VIAMONTE - LINIERS", "TIPO": "Matriz", "LONGITUD": "5.43 km", "CAPACIDAD": "80 m3/s", "Clase": "Zanjon", "OBSERVACIO": "Sistema mixto..." }, 
        "geometry": { 
          "type": "LineString", 
          "coordinates": [ 
            [ -68.89005369130011, -32.983565969400253 ], 
            [ -68.853207300710935, -32.95874891261505 ] 
          ] 
        } 
      },
      { 
        "type": "Feature", 
        "properties": { "fid": 6, "NOMBRE": "ZANJON CACIQUE GUAYMALLEN", "TIPO": "Gran colector aluvional", "LONGITUD": "27 km", "CAPACIDAD": "250 m3/s", "Clase": "Zanjon", "OBSERVACIO": "Principal canal..." }, 
        "geometry": { 
          "type": "LineString", 
          "coordinates": [ 
            [ -68.867434717283359, -33.000054891382696 ], 
            [ -68.719413682497546, -32.841913349 ] 
          ] 
        } 
      }
    ]
  };

  // 5. Cargar Capa de Alturas
  const layerAlturas = L.geoJSON(geojsonAlturas, {
    pointToLayer: function (feature, latlng) {
      return L.circleMarker(latlng, {
        radius: 8,
        fillColor: "#e67e22",
        color: "#d35400",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.8
      });
    },
    onEachFeature: function (feature, layer) {
      layer.bindPopup(`<b>${feature.properties.TIPO}: ${feature.properties.NOMBRE}</b><br>Cota: ${feature.properties.COTA} msnm`);
    }
  }).addTo(map);

  // 6. Cargar Capa de Colectores
  const layerColectores = L.geoJSON(geojsonColectores, {
    style: function(feature) {
      switch (feature.properties.Clase) {
        case 'Canal': return { color: '#2980b9', weight: 4 };
        case 'Zanjon': return { color: '#8e44ad', weight: 5 };
        default: return { color: '#27ae60', weight: 3 };
      }
    },
    onEachFeature: function (feature, layer) {
      let popupContent = `<b>${feature.properties.NOMBRE}</b><br>`;
      popupContent += `Tipo: ${feature.properties.TIPO}<br>`;
      popupContent += `Clase: ${feature.properties.Clase}<br>`;
      if (feature.properties.LONGITUD) popupContent += `Longitud: ${feature.properties.LONGITUD}<br>`;
      layer.bindPopup(popupContent);
    }
  }).addTo(map);

  // 7. Controles y ajuste de zoom automático
  L.control.layers(null, {
    "Alturas (Puntos)": layerAlturas,
    "Colectores (Líneas)": layerColectores
  }).addTo(map);

  const group = new L.featureGroup([layerAlturas, layerColectores]);
  map.fitBounds(group.getBounds());

</script>
</body>
</html>
