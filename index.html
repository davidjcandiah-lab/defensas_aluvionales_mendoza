<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa GeoJSON - Mendoza</title>

  <!-- CSS de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- JS de Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 1. Inicializar el mapa centrado en Mendoza
  const map = L.map('map').setView([-32.90, -68.85], 11);

  // 2. Capa base
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // 3. Alturas (Puntos)
  const geojsonAlturas = {
    "type": "FeatureCollection",
    "name": "Alturas",
    "features": [
      { "type": "Feature", "properties": { "TIPO": "CERRO", "NOMBRE": "DEL ARCO", "COTA": 1675.0, "FUENTE": "IGN" }, "geometry": { "type": "Point", "coordinates": [ -68.935234, -32.835018 ] } },
      { "type": "Feature", "properties": { "TIPO": "CERRO", "NOMBRE": "DE LA GLORIA", "COTA": 984.0, "FUENTE": "IGN" }, "geometry": { "type": "Point", "coordinates": [ -68.890953, -32.888015 ] } }
    ]
  };

  // 4. Colectores con la trazada completa (múltiples vértices intermedios [Lon, Lat])
  const geojsonColectores = {
    "type": "FeatureCollection",
    "name": "Colectores",
    "features": [
      {
        "type": "Feature",
        "properties": { "NOMBRE": "CANAL SOSA", "TIPO": "Matriz", "LONGITUD": "3.58 km", "CAPACIDAD": "200 m3/s", "Clase": "Canal" },
        "geometry": {
          "type": "LineString",
          "coordinates": [
            [-68.908645, -32.900054],
            [-68.907800, -32.925000],
            [-68.907172, -32.950000],
            [-68.907000, -32.975000],
            [-68.907172, -32.999066],
            [-68.885000, -32.996000],
            [-68.865347, -32.994242]
          ]
        }
      },
      {
        "type": "Feature",
        "properties": { "NOMBRE": "COLECTOR BALCARCE", "TIPO": "Descargador", "LONGITUD": "1.30 km", "Clase": "Colector" },
        "geometry": {
          "type": "LineString",
          "coordinates": [
            [-68.842268, -32.922866],
            [-68.841000, -32.919000],
            [-68.839800, -32.915500],
            [-68.838552, -32.911852]
          ]
        }
      },
      {
        "type": "Feature",
        "properties": { "NOMBRE": "COLECTOR BARRIO LOS CERRILLOS", "TIPO": "Canalización Intermedia", "LONGITUD": "0.91 km", "Clase": "Colector" },
        "geometry": {
          "type": "LineString",
          "coordinates": [
            [-68.887871, -32.905398],
            [-68.883500, -32.907200],
            [-68.879817, -32.909370]
          ]
        }
      },
      {
        "type": "Feature",
        "properties": { "NOMBRE": "CANAL RIO SECO", "TIPO": "Descargador", "LONGITUD": "1.61 km", "Clase": "Canal" },
        "geometry": {
          "type": "LineString",
          "coordinates": [
            [-68.880429, -32.965473],
            [-68.873000, -32.963000],
            [-68.865712, -32.960819]
          ]
        }
      },
      {
        "type": "Feature",
        "properties": { "NOMBRE": "RIO SECO TEJO - VIAMONTE - LINIERS", "TIPO": "Matriz", "LONGITUD": "5.43 km", "CAPACIDAD": "80 m3/s", "Clase": "Zanjon" },
        "geometry": {
          "type": "LineString",
          "coordinates": [
            [-68.890053, -32.983565],
            [-68.881000, -32.977000],
            [-68.870000, -32.970000],
            [-68.860000, -32.963000],
            [-68.853207, -32.958748]
          ]
        }
      },
      {
        "type": "Feature",
        "properties": { "NOMBRE": "ZANJON CACIQUE GUAYMALLEN", "TIPO": "Gran colector aluvional", "LONGITUD": "27 km", "CAPACIDAD": "250 m3/s", "Clase": "Zanjon" },
        "geometry": {
          "type": "LineString",
          "coordinates": [
            [-68.867434, -33.000054],
            [-68.859000, -32.970000],
            [-68.850000, -32.940000],
            [-68.845000, -32.910000],
            [-68.838000, -32.880000],
            [-68.780000, -32.860000],
            [-68.719413, -32.841913]
          ]
        }
      }
    ]
  };

  // 5. Cargar capa de Alturas (Puntos)
  const layerAlturas = L.geoJSON(geojsonAlturas, {
    pointToLayer: function (feature, latlng) {
      return L.circleMarker(latlng, {
        radius: 7,
        fillColor: "#e67e22",
        color: "#d35400",
        weight: 2,
        fillOpacity: 0.9
      });
    },
    onEachFeature: function (feature, layer) {
      layer.bindPopup(`<b>${feature.properties.TIPO}: ${feature.properties.NOMBRE}</b><br>Cota: ${feature.properties.COTA} msnm`);
    }
  }).addTo(map);

  // 6. Cargar capa de Colectores (Líneas)
  const layerColectores = L.geoJSON(geojsonColectores, {
    style: function(feature) {
      switch (feature.properties.Clase) {
        case 'Canal': return { color: '#2980b9', weight: 4 };
        case 'Zanjon': return { color: '#8e44ad', weight: 5 };
        default: return { color: '#27ae60', weight: 3 };
      }
    },
    onEachFeature: function (feature, layer) {
      layer.bindPopup(`<b>${feature.properties.NOMBRE}</b><br>Clase: ${feature.properties.Clase}<br>Longitud: ${feature.properties.LONGITUD || 'N/A'}`);
    }
  }).addTo(map);

  // 7. Ajuste automático del mapa
  const group = new L.featureGroup([layerAlturas, layerColectores]);
  map.fitBounds(group.getBounds());

</script>
</body>
</html>

</script>
</body>
</html>
