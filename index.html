<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor WebGIS - Red de Cauces y Alturas</title>

    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Estilos de la página y contenedor del mapa */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Estilo personalizado para las tablas dentro de los Popups */
        .popup-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }

        .popup-table th, .popup-table td {
            border: 1px solid #ddd;
            padding: 4px 8px;
            text-align: left;
        }

        .popup-table th {
            background-color: #f2f2f2;
            color: #333;
        }

        .popup-container {
            max-height: 220px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- Contenedor donde se renderizará el mapa -->
    <div id="map"></div>

    <!-- JS de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializar el mapa centrado en el área de Mendoza (coordenadas tomadas del GeoJSON)
        const map = L.map('map').setView([-32.90, -68.85], 11);

        // 2. Agregar capas base
        const osmBase = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const esriSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        // 3. Crear el control de capas vacías para ir agregándolas dinámicamente
        const baseMaps = {
            "OpenStreetMap": osmBase,
            "Satélite (Esri)": esriSatelite
        };
        
        const overlayMaps = {};
        const layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // 4. Función de simbología/estilo dinámico según la propiedad "Clase" o "TIPO"
        function obtenerEstiloLineas(feature) {
            const clase = feature.properties ? (feature.properties.Clase || feature.properties.TIPO || '') : '';

            switch (clase) {
                case 'Canal':
                    return { color: '#0072B2', weight: 4, opacity: 0.85 }; // Azul
                case 'Colector':
                    return { color: '#D55E00', weight: 3, opacity: 0.85 }; // Naranja
                case 'Zanjon':
                    return { color: '#009E73', weight: 4, opacity: 0.85 }; // Verde
                default:
                    return { color: '#3388ff', weight: 3, opacity: 0.75 }; // Azul por defecto
            }
        }

        // 5. Función para renderizar puntos (ej. capa Alturas)
        function crearMarcadorPunto(feature, latlng) {
            const opcionesPunto = {
                radius: 6,
                fillColor: '#E69F00', // Amarillo / Naranja claro
                color: '#000000',
                weight: 1,
                opacity: 1,
                fillOpacity: 0.85
            };

            const marker = L.circleMarker(latlng, opcionesPunto);
            
            // Tooltip rápido al pasar el cursor si existe la propiedad NOMBRE o COTA
            if (feature.properties && (feature.properties.NOMBRE || feature.properties.COTA)) {
                const texto = `${feature.properties.NOMBRE || 'Punto'} (${feature.properties.COTA ? feature.properties.COTA + ' m' : ''})`;
                marker.bindTooltip(texto, { permanent: false, direction: 'top' });
            }

            return marker;
        }

        // 6. Generador de Popups dinámicos leyendo todos los atributos del Feature
        function construirPopup(properties) {
            if (!properties || Object.keys(properties).length === 0) return '<em>Sin atributos disponibles</em>';
            
            let html = '<div class="popup-container"><table class="popup-table">';
            html += '<thead><tr><th>Atributo</th><th>Valor</th></tr></thead><tbody>';
            
            for (const key in properties) {
                if (properties[key] !== null && properties[key] !== undefined) {
                    html += `<tr><td><strong>${key}</strong></td><td>${properties[key]}</td></tr>`;
                }
            }
            
            html += '</tbody></table></div>';
            return html;
        }

        // 7. Función principal para procesar y añadir un GeoJSON al mapa
        function cargarGeoJSON(url, nombreCapa) {
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Error HTTP: ${response.status} en ${url}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Usar el campo "name" interno del GeoJSON si no se especifica nombreCapa
                    const etiqueta = nombreCapa || data.name || url.split('/').pop().replace('.geojson', '');

                    const capa = L.geoJSON(data, {
                        style: obtenerEstiloLineas,
                        pointToLayer: crearMarcadorPunto,
                        onEachFeature: function (feature, layer) {
                            if (feature.properties) {
                                layer.bindPopup(construirPopup(feature.properties));
                            }
                        }
                    }).addTo(map);

                    // Agregar al control de capas para encender/apagar
                    layerControl.addOverlay(capa, etiqueta);
                })
                .catch(error => {
                    console.error('Error al cargar la capa GeoJSON:', error);
                });
        }

        // 8. Cargar los archivos GeoJSON desde tu repositorio
        // Reemplaza o agrega las rutas relativas de tus archivos .geojson dentro del proyecto:
        cargarGeoJSON('data/alturas.geojson', 'Alturas Cota');
        cargarGeoJSON('data/colectores.geojson', 'Red de Cauces y Colectores');

    </script>
</body>
</html>
